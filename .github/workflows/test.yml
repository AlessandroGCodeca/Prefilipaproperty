name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign_final
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sovereign_final/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Skip playwright/curl_cffi — heavy runtime-only deps not imported
          # anywhere the tests reach. streamlit stays: tests/test_app_smoke.py
          # runs the dashboard script with it.
          grep -v -E "^(playwright|curl_cffi)" requirements.txt > requirements-test.txt
          pip install -r requirements-test.txt pytest ruff

      - name: Check requirements.txt resolves
        # The install above leaves playwright and curl_cffi out, so a pin pip
        # cannot find (playwright==1.56.1, never released on PyPI) passed CI
        # and only broke the Docker build. Resolve the whole file; install nothing.
        run: pip install --dry-run --ignore-installed --quiet -r requirements.txt

      - name: Lint with ruff
        # Only fail on real-bug classes (E9 syntax, F63 invalid comparisons,
        # F7 syntax issues, F82 undefined names). Style warnings don't fail.
        run: ruff check . --select=E9,F63,F7,F82 --output-format=github

      - name: Run tests
        run: pytest tests/ -v --tb=short
