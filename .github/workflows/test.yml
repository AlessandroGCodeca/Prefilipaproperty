name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign_final
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Use the pre-installed Python on the runner. Skip the heaviest
          # runtime-only deps (playwright/streamlit/curl_cffi/psycopg2) that
          # aren't imported by anything under tests/.
          python3 -m pip install --upgrade pip --break-system-packages || python3 -m pip install --upgrade pip
          grep -v -E "^(playwright|streamlit|curl_cffi|psycopg2)" requirements.txt > requirements-test.txt
          python3 -m pip install --break-system-packages -r requirements-test.txt pytest ruff \
            || python3 -m pip install -r requirements-test.txt pytest ruff

      - name: Lint with ruff
        run: python3 -m ruff check . --select=E9,F63,F7,F82 --output-format=github
        # Only fail on the four classes that are almost always real bugs:
        # E9  syntax errors / F63 invalid comparisons / F7 syntax / F82 undefined names

      - name: Run tests
        run: python3 -m pytest tests/ -v --tb=short
