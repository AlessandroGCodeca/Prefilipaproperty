name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows too: the project is run from a Windows PC (START.bat), and a
    # path, encoding or file-locking difference only shows up there.
    # Python: the launchers accept 3.11–3.14, so Linux tests both ends plus
    # 3.12 (the Docker image's version). Windows runs 3.12 only: it is there
    # for the OS differences, not the Python ones.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sovereign_final
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sovereign_final/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Skip playwright — a heavy runtime-only dep (plus a browser) that
          # nothing the tests reach imports. streamlit stays:
          # tests/test_app_smoke.py runs the dashboard script with it.
          grep -v -E "^playwright" requirements.txt > requirements-test.txt
          pip install -r requirements-test.txt pytest ruff

      - name: Check requirements.txt resolves
        # The install above leaves playwright out, so a pin pip
        # cannot find (playwright==1.56.1, never released on PyPI) passed CI
        # and only broke the Docker build. Resolve the whole file; install nothing.
        run: pip install --dry-run --ignore-installed --quiet -r requirements.txt

      - name: Lint with ruff
        # The rule set (syntax errors, pyflakes, bugbear, pylint warnings; no
        # style) lives in pyproject.toml, so a local `ruff check .` matches CI.
        run: ruff check . --output-format=github

      - name: Run tests
        run: pytest tests/ -v --tb=short
