# Dark theme to match the custom CSS in app.py. Without it Streamlit's default
# light theme shows through on everything the CSS doesn't reach: the header bar,
# selectboxes, number inputs, and the red slider thumbs and multiselect tags.
# Streamlit reads this file from the folder it is started in (sovereign_final/,
# /app in Docker).
# Two themes (D14): dark, palette 1, the default look, and light, palette 3
# ("paper light"), for daylight and a projector. Switch in the ⋮ menu, top
# right: Settings → Choose app theme (Light, Dark, or your device's setting).
# The page's own colours follow (dashboard/style.py, html[data-theme]).
# No "base" here: Streamlit takes it only in [theme] and tells each theme
# apart by its backgroundColor.
[theme.dark]
primaryColor = "#3ddc97"
backgroundColor = "#07090e"
secondaryBackgroundColor = "#0b0d14"
textColor = "#bcc8e0"

[theme.light]
primaryColor = "#0a6b43"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#2a3342"

# "minimal" hides the toolbar's Deploy button (Streamlit Community Cloud,
# which this private dashboard must never be published to) and the developer
# options; the menu keeps Rerun, Settings and Print.
[client]
toolbarMode = "minimal"
# Errors: the browser shows the kind of error and a generic message, never its
# text or traceback (they can carry a URL with a key, a file path or a
# person's name from a deed); the terminal keeps the full error. No "Ask
# Google / ChatGPT" links, which would send an error's text to them.
showErrorDetails = "type"
showErrorLinks = false

[browser]
# Streamlit's own usage statistics stay off: a visitor's browser would report
# to a third party, which needs consent under the ePrivacy rules once other
# people use the dashboard.
gatherUsageStats = false

[server]
# Uploads: a deal document is at most 15 MB and a scan Claude reads at most
# 20 MB, so nothing larger is accepted (Streamlit's default is 200 MB, held in
# memory while it uploads).
maxUploadSize = 25
# Both on by default; set here so they can't be switched off by accident.
enableXsrfProtection = true
enableCORS = true
# D15: serves ./static at app/static/ — only the IBM Plex fonts and their
# licence (static/fonts). Anything put there is public, without a login, so
# nothing else goes in that folder.
enableStaticServing = true
