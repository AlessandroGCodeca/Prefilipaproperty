services:

  model-runner:
    image: ai/mistral:7b-instruct-q4_k_m
    container_name: sovereign_dmr
    restart: unless-stopped
    ports:
      - "12434:12434"
    volumes:
      - model_cache:/root/.docker/models

  # The dashboard and the scheduler share one SQLite database
  # (/app/data/sovereign.db) on the named volume `sovereign_data`. A named
  # volume lives on the Docker VM's own filesystem, where SQLite's file locking
  # works across both containers; a Windows/macOS bind mount does not
  # guarantee that.
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sovereign_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      DMR_ENDPOINT:          http://model-runner:12434/v1
      LLM_MODEL:             mistral:7b-instruct-q4_k_m
    volumes:
      - ./contracts:/app/contracts
      - ./logs:/app/logs
      - sovereign_data:/app/data
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sovereign_scheduler
    restart: unless-stopped
    environment:
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      DMR_ENDPOINT:          http://model-runner:12434/v1
    volumes:
      - ./logs:/app/logs
      - sovereign_data:/app/data
    command: python scheduler.py

volumes:
  sovereign_data:
  model_cache:
